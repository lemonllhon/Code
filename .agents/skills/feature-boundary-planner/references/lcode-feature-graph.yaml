      - "Remote blank drafts do not prewarm execution; trusted builtin tools remain discoverable before their first process starts."
      - "Memory reservations belong to existing process/Worker owners until confirmed cleanup, and never become another accepted command queue."
      - "Cached SSH transport does not retain an idle workspace Agent after its last logical owner; running tasks and reattach generations preserve existing release fences."

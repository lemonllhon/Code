      - "A cooling resource admits one probe; physical completion and normalized success jointly confirm recovery, with versioned file ownership for shared API pools."
      - "Directory profiles preserve model context and recovery deadlines; outcome-only feedback refreshes the affected index entries."
      - "Read-only diagnostics distinguish local preview from authoritative shared debits and retain unknown failures without replaying dispatch."
